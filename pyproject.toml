[project]
name = "ezpit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jakub Wlodek", email = "jwlodek@bnl.gov" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]

[project.scripts]
ezpit-wh-smooth = "ezpit.wh_smooth:main"
ezpit-gui = "ezpit.gui.main:main"

[project.optional-dependencies]
gui = [
    "pandas>=3.0.5",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
]
examples = [
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pre-commit>=4.6.1",
    "pyinstaller>=6.21.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]
